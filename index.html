<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San SandWich - รายรับรายจ่าย</title>
<style>
  :root{
    --crust:#C98A3E;
    --crust-dark:#9C6428;
    --lettuce:#5C8A4A;
    --tomato:#C2452F;
    --cream:#FBF4E8;
    --ink:#2E2418;
    --ink-soft:#6B5D4B;
    --card:#ffffff;
    --line:#EAE0CC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Noto Sans Thai', -apple-system, sans-serif;
    background:var(--cream);
    color:var(--ink);
    padding-bottom:40px;
  }
  .stripe{
    height:6px;
    background:linear-gradient(90deg,
      var(--crust) 0 20%,
      var(--lettuce) 20% 40%,
      var(--tomato) 40% 60%,
      var(--crust-dark) 60% 80%,
      var(--lettuce) 80% 100%);
  }
  header{
    padding:20px 18px 10px;
  }
  header h1{
    font-size:1.3rem;
    margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.85rem;
  }
  .wrap{ padding:0 16px; max-width:520px; margin:0 auto; }

  .hero{
    background:var(--ink);
    color:var(--cream);
    border-radius:18px;
    padding:22px 20px;
    margin:14px 0;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:5px;
    background:linear-gradient(90deg,var(--crust),var(--lettuce),var(--tomato));
  }
  .hero .label{ font-size:0.78rem; opacity:0.7; letter-spacing:0.03em; }
  .hero .value{ font-size:2.1rem; font-weight:700; margin:4px 0 14px; }
  .hero .value.neg{ color:#E8907C; }
  .hero .value.pos{ color:#9FCB86; }
  .hero .sub{ display:flex; gap:22px; font-size:0.82rem; }
  .hero .sub b{ display:block; font-size:1rem; font-weight:600; }
  .sub .inc b{ color:#9FCB86; }
  .sub .exp b{ color:#E8907C; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:0.95rem;
    margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .card h2::before{
    content:"";
    width:8px;height:8px;border-radius:50%;
    background:var(--crust);
  }

  .toggle{
    display:flex;
    background:var(--cream);
    border-radius:10px;
    padding:4px;
    margin-bottom:12px;
  }
  .toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    border-radius:7px;
    font-size:0.88rem;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .toggle button.active.income{ background:var(--lettuce); color:#fff; }
  .toggle button.active.expense{ background:var(--tomato); color:#fff; }
  .toggle button.active.neutral{ background:var(--crust-dark); color:#fff; }

  label{
    display:block;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin:10px 0 4px;
  }
  input, select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:0.95rem;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  .submit-btn{
    width:100%;
    margin-top:16px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--crust-dark);
    color:#fff;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
  }
  .submit-btn:active{ opacity:0.85; }
  .cancel-btn{
    width:100%;
    margin-top:8px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:transparent;
    color:var(--ink-soft);
    font-size:0.88rem;
    cursor:pointer;
  }

  #receiptPreview{
    margin-top:8px;
    padding:8px 10px;
    background:var(--cream);
    border-radius:8px;
    font-size:0.8rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  #receiptPreview a{ color:var(--crust-dark); text-decoration:none; font-weight:600; }
  #receiptPreview button{
    border:none; background:none; color:var(--tomato);
    font-size:0.78rem; cursor:pointer; white-space:nowrap;
  }
  .tx-receipt{
    font-size:0.72rem;
    color:var(--crust-dark);
    text-decoration:none;
    display:block;
    margin-top:2px;
  }

  .tx-item{
    display:flex;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .tx-item:last-child{ border-bottom:none; }
  .tx-main{ min-width:0; flex:1; }
  .tx-desc{ font-size:0.9rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-meta{ font-size:0.75rem; color:var(--ink-soft); }
  .tx-amt{
    font-weight:700;
    font-size:0.92rem;
    white-space:nowrap;
    min-width:82px;
    flex-shrink:0;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .tx-amt.income{ color:var(--lettuce); }
  .tx-amt.expense{ color:var(--tomato); }
  .tx-del{
    border:none; background:none; color:var(--ink-soft);
    font-size:1rem; cursor:pointer; padding:4px 6px;
    flex-shrink:0;
  }
  .tx-edit{
    border:none; background:none; color:var(--ink-soft);
    font-size:0.95rem; cursor:pointer; padding:4px 6px;
    flex-shrink:0;
  }

  .empty{ text-align:center; color:var(--ink-soft); font-size:0.85rem; padding:20px 0; }
  .loading{ text-align:center; color:var(--ink-soft); font-size:0.85rem; padding:20px 0; }

  .cat-row{ display:flex; justify-content:space-between; font-size:0.85rem; padding:6px 0; }
  .cat-row .bar{ flex:1; height:6px; background:var(--line); border-radius:4px; margin:0 10px; overflow:hidden; }
  .cat-row .bar-fill{ height:100%; background:var(--tomato); }

  .period-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .period-item:last-child{ border-bottom:none; }
  .period-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:5px;
  }
  .period-label{ font-size:0.85rem; font-weight:600; color:var(--ink-soft); }
  .period-profit{ font-size:0.95rem; font-weight:700; }
  .period-profit.pos{ color:var(--lettuce); }
  .period-profit.neg{ color:var(--tomato); }
  .period-bars{ display:flex; gap:3px; height:6px; border-radius:4px; overflow:hidden; background:var(--line); }
  .period-bars .inc-bar{ background:var(--lettuce); }
  .period-bars .exp-bar{ background:var(--tomato); }
  .period-meta{ display:flex; justify-content:space-between; font-size:0.72rem; color:var(--ink-soft); margin-top:4px; }

  .dl-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .dl-item:last-child{ border-bottom:none; }
  .dl-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .dl-date{ font-size:0.9rem; font-weight:700; }
  .dl-actions button{
    border:none; background:none; color:var(--ink-soft);
    font-size:0.95rem; cursor:pointer; padding:2px 6px;
  }
  .dl-actions button:first-child:not(:only-child){ color:var(--crust-dark); }
  .dl-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:4px 14px;
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .dl-menu{
    font-size:0.78rem;
    color:var(--crust-dark);
    margin-bottom:6px;
  }
  .dl-grid b{ color:var(--ink); font-weight:600; }

  .accordion-header{
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .accordion-header:active{ opacity:0.85; }
  .accordion-header h2{ margin:0; }
  .accordion-arrow{
    color:var(--ink-soft);
    font-size:0.85rem;
    transition:transform 0.2s ease;
    flex-shrink:0;
  }
  .accordion-arrow.open{ transform:rotate(180deg); }
  .accordion-body{ margin-top:12px; }

  #menuItemList{ margin-bottom:8px; }
  .menu-row{
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .menu-row:last-child{ border-bottom:none; }
  .menu-row-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .menu-row-name{ font-size:0.88rem; font-weight:600; }
  .menu-row-sizes{
    display:flex;
    gap:10px;
  }
  .menu-size-group{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .menu-size-label{ font-size:0.7rem; color:var(--ink-soft); }
  .menu-stepper{
    display:flex;
    align-items:center;
    gap:0;
    flex-shrink:0;
  }
  .menu-stepper input[type="number"]{
    width:36px;
    text-align:center;
    padding:6px 2px;
    border-left:none;
    border-right:none;
    border-radius:0;
    -moz-appearance:textfield;
  }
  .menu-stepper input[type="number"]::-webkit-inner-spin-button,
  .menu-stepper input[type="number"]::-webkit-outer-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .stepper-btn{
    width:28px;
    height:32px;
    border:1px solid var(--line);
    background:var(--cream);
    color:var(--crust-dark);
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
    line-height:1;
  }
  .stepper-btn:first-child{ border-radius:8px 0 0 8px; }
  .stepper-btn:last-child{ border-radius:0 8px 8px 0; }
  .stepper-btn:active{ background:var(--line); }
  .menu-row-del{
    border:none; background:none; color:var(--ink-soft);
    font-size:0.9rem; cursor:pointer; padding:2px 4px; flex-shrink:0;
  }
  .menu-add-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .menu-add-row input{ flex:1; }
  .menu-add-row button{
    border:none;
    background:var(--crust-dark);
    color:#fff;
    border-radius:8px;
    padding:0 14px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="stripe"></div>
  <header>
    <div class="wrap">
      <h1>🥪 San SandWich</h1>
      <p>บันทึกรายรับ-รายจ่ายประจำวัน</p>
    </div>
  </header>

  <div class="wrap">
    <div class="toggle" style="margin-top:14px;">
      <button type="button" class="active neutral" id="tabFinance" onclick="switchTab('finance')">รายรับ-รายจ่าย</button>
      <button type="button" id="tabDailyLog" onclick="switchTab('dailylog')">บันทึกประจำวัน</button>
    </div>

    <div id="financeView">
    <div class="hero">
      <div class="label">กำไร/ขาดทุนสุทธิ</div>
      <div class="value" id="netProfit">฿0</div>
      <div class="sub">
        <div class="inc">รายรับ<b id="totalIncome">฿0</b></div>
        <div class="exp">รายจ่าย<b id="totalExpense">฿0</b></div>
      </div>
    </div>

    <div class="card">
      <div class="accordion-header" onclick="toggleAccordion('addTxBody')">
        <h2 id="formTitle">เพิ่มรายการ</h2>
        <span class="accordion-arrow" id="addTxBodyArrow">▾</span>
      </div>
      <div class="accordion-body" id="addTxBody" style="display:none;">
      <div class="toggle">
        <button type="button" class="active income" id="btnIncome" onclick="setType('รายรับ')">รายรับ</button>
        <button type="button" class="expense" id="btnExpense" onclick="setType('รายจ่าย')">รายจ่าย</button>
      </div>

      <label>วันที่</label>
      <input type="date" id="fDate">

      <label>หมวดหมู่</label>
      <input type="text" id="fCategory" placeholder="เช่น ขนมปัง, ค่าเช่า, ขายหน้าร้าน">

      <label>รายละเอียด</label>
      <input type="text" id="fDesc" placeholder="เช่น ซื้อขนมปัง 20 ก้อน">

      <label>จำนวนเงิน (บาท)</label>
      <input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0" onfocus="this.select(); scrollFieldIntoView(this)" oninput="stripLeadingZero(this)">

      <label>รูปบิล (ถ้ามี)</label>
      <input type="file" id="fReceipt" accept="image/*,.pdf" onchange="onReceiptChosen()">
      <div id="receiptPreview" style="display:none;"></div>

      <button class="submit-btn" id="submitBtn" onclick="submitTx()">บันทึกรายการ</button>
      <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()" style="display:none;">ยกเลิกการแก้ไข</button>
      </div>
    </div>

    <div class="card" id="catCard" style="display:none;">
      <div class="accordion-header" onclick="toggleAccordion('catBody')">
        <h2>รายจ่ายแยกตามหมวด</h2>
        <span class="accordion-arrow" id="catBodyArrow">▾</span>
      </div>
      <div class="accordion-body" id="catBody" style="display:none;">
        <select id="catMonthSelect" onchange="renderCategoriesForMonth()" style="margin-bottom:10px;"></select>
        <div id="catList"></div>
      </div>
    </div>

    <div class="card">
      <div class="accordion-header" onclick="toggleAccordion('periodBody')">
        <h2>สรุปยอด</h2>
        <span class="accordion-arrow" id="periodBodyArrow">▾</span>
      </div>
      <div class="accordion-body" id="periodBody" style="display:none;">
        <div class="toggle">
          <button type="button" class="active neutral" id="btnWeekly" onclick="setPeriodView('weekly')">รายสัปดาห์</button>
          <button type="button" id="btnMonthly" onclick="setPeriodView('monthly')">รายเดือน</button>
        </div>
        <div id="periodList"><div class="empty">ยังไม่มีข้อมูล</div></div>
      </div>
    </div>

    <div class="card">
      <h2>รายการล่าสุด</h2>
      <select id="txWeekSelect" onchange="renderTxListForWeek()" style="margin-bottom:10px;"></select>
      <div id="txList"><div class="loading">กำลังโหลด...</div></div>
    </div>
    </div>

    <div id="dailyLogView" style="display:none;">
      <div class="card">
        <div class="accordion-header" onclick="toggleAccordion('dlFormBody')">
          <h2 id="dailyLogFormTitle">บันทึกประจำวัน</h2>
          <span class="accordion-arrow" id="dlFormBodyArrow">▾</span>
        </div>
        <div class="accordion-body" id="dlFormBody" style="display:none;">
        <label>วันที่</label>
        <input type="date" id="dlDate">

        <label>เมนูที่จะทำวันนี้</label>
        <div id="menuItemList"></div>
        <div id="menuTotalDisplay" style="text-align:right; font-weight:700; font-size:0.85rem; color:var(--crust-dark); margin:2px 0 10px;">รวมทั้งหมด 0 ชิ้น</div>
        <div class="menu-add-row">
          <input type="text" id="menuNewName" placeholder="เพิ่มเมนูใหม่ เช่น หมูหยอง">
          <button type="button" onclick="addMenuItemUI()">+ เพิ่ม</button>
        </div>

        <label>วันนี้ทำ (กล่อง) <span style="font-weight:400; color:var(--ink-soft); font-size:0.75rem;">— รวมจากเมนูด้านบน แก้ไขได้</span></label>
        <input type="number" id="dlMade" placeholder="0" min="0" onfocus="this.select(); scrollFieldIntoView(this)" oninput="stripLeadingZero(this); recalcDailyLog()">

        <label>ขายได้ (กล่อง)</label>
        <input type="number" id="dlSold" placeholder="0" min="0" onfocus="this.select(); scrollFieldIntoView(this)" oninput="stripLeadingZero(this); recalcDailyLog()">

        <label>เหลือ (กล่อง) <span style="font-weight:400; color:var(--ink-soft); font-size:0.75rem;">— คำนวณอัตโนมัติ แก้ไขได้</span></label>
        <input type="number" id="dlRemaining" placeholder="0" min="0" onfocus="this.select(); scrollFieldIntoView(this)" oninput="stripLeadingZero(this)">

        <label>เอาไป (กล่อง)</label>
        <input type="number" id="dlTakenAway" placeholder="0" min="0" onfocus="this.select(); scrollFieldIntoView(this)" oninput="stripLeadingZero(this)">

        <label>เงินโอน (บาท)</label>
        <input type="number" id="dlTransfer" placeholder="0.00" step="0.01" min="0" onfocus="this.select(); scrollFieldIntoView(this)" oninput="stripLeadingZero(this); recalcDailyLog()">

        <label>เงินสด (บาท) <span style="font-weight:400; color:var(--ink-soft); font-size:0.75rem;">— คำนวณอัตโนมัติ แก้ไขได้</span></label>
        <input type="number" id="dlCash" placeholder="0.00" step="0.01" min="0" onfocus="this.select(); scrollFieldIntoView(this)" oninput="stripLeadingZero(this)">

        <label>เงินทอน (บาท)</label>
        <input type="number" id="dlBasketCash" placeholder="0.00" step="0.01" min="0" onfocus="this.select(); scrollFieldIntoView(this)" oninput="stripLeadingZero(this)">

        <button class="submit-btn" id="dlSubmitBtn" onclick="submitDailyLog()">บันทึก</button>
        <button class="cancel-btn" id="dlCancelBtn" onclick="cancelDailyLogEdit()" style="display:none;">ยกเลิกการแก้ไข</button>
        </div>
      </div>

      <div class="card">
        <h2>ประวัติบันทึกประจำวัน</h2>
        <p style="margin:-6px 0 12px; font-size:0.78rem; color:var(--ink-soft);">พรุ่งนี้ + ย้อนหลัง 7 วัน</p>
        <div id="dailyLogList"><div class="loading">กำลังโหลด...</div></div>
      </div>
    </div>
  </div>

<script>
  // ===== API config =====
  // 1. Deploy Code.gs as a Web App (Anyone access) in Apps Script, copy the /exec URL below.
  // 2. Set the SAME value here as the "API_TOKEN" Script Property in Apps Script
  //    (Project Settings > Script Properties). This is what keeps random people
  //    from hitting your API and editing your shop's data.
  const API_BASE_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE/exec';
  const API_TOKEN = 'PASTE_YOUR_SHARED_SECRET_HERE';

  // Apps Script Web Apps don't reliably send the CORS headers a normal
  // fetch() needs — even with "Anyone" access set correctly, browsers block
  // reading the response. So reads go through JSONP (a <script> tag, which
  // isn't subject to CORS) and writes go through a hidden iframe form
  // submission (also not subject to CORS). Neither technique touches fetch().

  let jsonpCounter_ = 0;

  // GET request for read-only actions (getAllData, getDailyLogs, getMenuItems)
  function apiGet(action, extraParams){
    return new Promise(function(resolve, reject){
      const callbackName = 'apiJsonpCallback_' + (jsonpCounter_++) + '_' + Date.now();
      const params = Object.assign({ action: action, token: API_TOKEN, callback: callbackName }, extraParams || {});
      const qs = Object.keys(params)
        .map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); })
        .join('&');

      const script = document.createElement('script');
      let settled = false;

      function cleanup(){
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = function(json){
        settled = true;
        cleanup();
        if (!json.success) reject(new Error(json.error || 'เกิดข้อผิดพลาด'));
        else resolve(json.data);
      };

      script.onerror = function(){
        if (settled) return;
        cleanup();
        reject(new Error('เชื่อมต่อ API ไม่สำเร็จ (เช็ค API_BASE_URL ว่าใส่ถูกไหม)'));
      };

      script.src = API_BASE_URL + '?' + qs;
      document.body.appendChild(script);
    });
  }

  // POST request for write actions, sent via a hidden iframe form submit.
  // Apps Script reads the JSON from the field NAME (the whole payload is put
  // there, with an empty value) — enctype="text/plain" sends that as
  // "<json>=" verbatim, and Code.gs strips the trailing "=" before parsing.
  // We can't read the cross-origin iframe's response, so this resolves
  // optimistically after a short delay; real errors surface on the next
  // data reload (which every call site already does).
  function apiPost(action, payload){
    return new Promise(function(resolve){
      const body = Object.assign({ action: action, token: API_TOKEN }, payload || {});
      const json = JSON.stringify(body);

      let iframe = document.getElementById('apiPostFrame');
      if (!iframe){
        iframe = document.createElement('iframe');
        iframe.name = 'apiPostFrame';
        iframe.id = 'apiPostFrame';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
      }

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = API_BASE_URL;
      form.target = 'apiPostFrame';
      form.enctype = 'text/plain';

      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = json; // the entire JSON payload, used as the field NAME
      input.value = '';
      form.appendChild(input);

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);

      setTimeout(resolve, 500); // give Apps Script time to finish processing
    });
  }

  let currentType = 'รายรับ';
  let cachedData = null;
  let editingRowIndex = null;
  let pendingReceipt = null;      // {base64, mimeType, filename} for a newly chosen file
  let existingReceiptUrl = '';    // current receipt url when editing
  let removeReceiptFlag = false;  // true if user removed the existing receipt

  let currentTab = 'finance';
  let cachedDailyLogs = null;
  let editingDailyLogRowIndex = null;
  let cachedMenuItems = [];

  function setType(type){
    currentType = type;
    document.getElementById('btnIncome').classList.toggle('active', type === 'รายรับ');
    document.getElementById('btnExpense').classList.toggle('active', type === 'รายจ่าย');
  }

  function fmt(n){
    return '฿' + Number(n).toLocaleString('th-TH', {minimumFractionDigits:0, maximumFractionDigits:2});
  }

  function todayStr(){
    return localDateStr_(new Date());
  }

  // Formats a Date using the device's local date parts (not UTC),
  // so "today" matches the phone's actual clock instead of shifting
  // at UTC midnight (which is 7:00 AM Thai time).
  function localDateStr_(d){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  // extra safeguard: strip an accidental leading zero as the user types (e.g. "05" -> "5")
  function stripLeadingZero(input){
    const v = input.value;
    if (v.length > 1 && v[0] === '0' && v[1] !== '.'){
      input.value = v.replace(/^0+/, '') || '0';
    }
  }

  // keeps the focused field visible above the on-screen keyboard (which otherwise
  // covers the bottom of the form/modal on mobile). Retries a few times since the
  // keyboard's open animation and the modal's own resize can both still be
  // settling when focus first fires.
  function scrollFieldIntoView(el){
    [50, 250, 450].forEach(function(delay){
      setTimeout(function(){
        if (document.activeElement === el){
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, delay);
    });
  }

  function loadData(){
    document.getElementById('fDate').value = todayStr();
    apiGet('getAllData').then(renderAll).catch(onError);
  }

  function onError(err){
    document.getElementById('txList').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + err.message + '</div>';
  }

  let periodView = 'weekly';
  let selectedCatMonth = null; // null = not yet chosen, defaults to latest month
  let selectedTxWeek = null;   // null = not yet chosen, defaults to latest week

  function renderAll(data){
    cachedData = data;
    const s = data.summary;
    const net = s.netProfit;
    const netEl = document.getElementById('netProfit');
    netEl.textContent = fmt(net);
    netEl.className = 'value ' + (net >= 0 ? 'pos' : 'neg');
    document.getElementById('totalIncome').textContent = fmt(s.totalIncome);
    document.getElementById('totalExpense').textContent = fmt(s.totalExpense);

    renderCategories(data);
    renderPeriods(data.periodSummary);
    renderTxWeekOptions(data);
  }

  function renderTxWeekOptions(data){
    const weeks = (data.periodSummary && data.periodSummary.weekly) || [];
    const select = document.getElementById('txWeekSelect');

    if (!weeks.length){
      select.innerHTML = '<option value="all">ทั้งหมด</option>';
      selectedTxWeek = 'all';
      select.value = 'all';
      renderTxListForWeek();
      return;
    }

    const options = weeks.map(function(w){ return '<option value="' + w.sortKey + '">สัปดาห์ ' + w.label + '</option>'; })
      .concat(['<option value="all">ทั้งหมด</option>']);
    select.innerHTML = options.join('');

    const validValues = weeks.map(function(w){ return w.sortKey; }).concat(['all']);
    if (selectedTxWeek === null || validValues.indexOf(selectedTxWeek) === -1){
      selectedTxWeek = weeks[0].sortKey; // latest week by default
    }
    select.value = selectedTxWeek;
    renderTxListForWeek();
  }

  function renderTxListForWeek(){
    if (!cachedData) return;
    const select = document.getElementById('txWeekSelect');
    selectedTxWeek = select.value;

    const items = (selectedTxWeek === 'all')
      ? cachedData.transactions
      : cachedData.transactions.filter(function(tx){ return tx.weekKey === selectedTxWeek; });

    renderTxList(items);
  }

  function setPeriodView(view){
    periodView = view;
    document.getElementById('btnWeekly').classList.toggle('active', view === 'weekly');
    document.getElementById('btnWeekly').classList.toggle('neutral', view === 'weekly');
    document.getElementById('btnMonthly').classList.toggle('active', view === 'monthly');
    document.getElementById('btnMonthly').classList.toggle('neutral', view === 'monthly');
    if (cachedData) renderPeriods(cachedData.periodSummary);
  }

  function renderPeriods(periodSummary){
    const el = document.getElementById('periodList');
    if (!periodSummary){ el.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }
    const items = periodSummary[periodView] || [];
    if (!items.length){ el.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }

    el.innerHTML = items.map(function(p){
      const total = p.income + p.expense;
      const incPct = total ? (p.income / total) * 100 : 0;
      const expPct = total ? (p.expense / total) * 100 : 0;
      const profitCls = p.profit >= 0 ? 'pos' : 'neg';
      const profitSign = p.profit >= 0 ? '+' : '';
      return '<div class="period-item">' +
        '<div class="period-top">' +
          '<span class="period-label">' + p.label + '</span>' +
          '<span class="period-profit ' + profitCls + '">' + profitSign + fmt(p.profit) + '</span>' +
        '</div>' +
        '<div class="period-bars">' +
          '<span class="inc-bar" style="width:' + incPct + '%"></span>' +
          '<span class="exp-bar" style="width:' + expPct + '%"></span>' +
        '</div>' +
        '<div class="period-meta">' +
          '<span>รับ ' + fmt(p.income) + '</span>' +
          '<span>จ่าย ' + fmt(p.expense) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderCategories(data){
    const catCard = document.getElementById('catCard');
    const s = data.summary;
    const byMonth = data.categoryByMonth || [];

    if (!Object.keys(s.categoryBreakdown || {}).length){
      catCard.style.display = 'none';
      return;
    }
    catCard.style.display = 'block';

    const select = document.getElementById('catMonthSelect');
    const options = ['<option value="all">ทั้งหมด (ทุกช่วงเวลา)</option>']
      .concat(byMonth.map(function(m){ return '<option value="' + m.sortKey + '">' + m.label + '</option>'; }));
    select.innerHTML = options.join('');

    // keep current selection if still valid; otherwise default to the latest month (or 'all' if no data)
    const validValues = ['all'].concat(byMonth.map(function(m){ return m.sortKey; }));
    if (selectedCatMonth === null || validValues.indexOf(selectedCatMonth) === -1) {
      selectedCatMonth = byMonth.length ? byMonth[0].sortKey : 'all';
    }
    select.value = selectedCatMonth;

    renderCategoriesForMonth();
  }

  function renderCategoriesForMonth(){
    if (!cachedData) return;
    const select = document.getElementById('catMonthSelect');
    selectedCatMonth = select.value;

    let breakdown, total;
    if (selectedCatMonth === 'all'){
      breakdown = cachedData.summary.categoryBreakdown;
      total = cachedData.summary.totalExpense;
    } else {
      const monthData = (cachedData.categoryByMonth || []).find(function(m){ return m.sortKey === selectedCatMonth; });
      breakdown = monthData ? monthData.categories : {};
      total = Object.values(breakdown).reduce(function(sum, v){ return sum + v; }, 0);
    }

    const keys = Object.keys(breakdown || {});
    const el = document.getElementById('catList');
    if (!keys.length){ el.innerHTML = '<div class="empty">ไม่มีรายจ่ายในช่วงนี้</div>'; return; }

    const sorted = keys.sort(function(a,b){ return breakdown[b] - breakdown[a]; });
    el.innerHTML = sorted.map(function(cat){
      const pct = total ? Math.round((breakdown[cat] / total) * 100) : 0;
      return '<div class="cat-row"><span>' + cat + '</span>' +
        '<span class="bar"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
        '<span>' + fmt(breakdown[cat]) + '</span></div>';
    }).join('');
  }

  function renderTxList(items){
    const el = document.getElementById('txList');
    if (!items.length){ el.innerHTML = '<div class="empty">ไม่มีรายการในช่วงนี้</div>'; return; }
    el.innerHTML = items.slice(0, 50).map(tx => {
      const cls = tx.type === 'รายรับ' ? 'income' : 'expense';
      const sign = tx.type === 'รายรับ' ? '+' : '-';
      return '<div class="tx-item">' +
        '<div class="tx-main">' +
          '<div class="tx-desc">' + escapeHtml(tx.category) + '</div>' +
          '<div class="tx-meta">' + tx.date + (tx.description ? ' · ' + escapeHtml(tx.description) : '') + '</div>' +
          (tx.receiptUrl ? '<a class="tx-receipt" href="' + tx.receiptUrl + '" target="_blank">📎 ดูใบเสร็จ</a>' : '') +
        '</div>' +
        '<div class="tx-amt ' + cls + '">' + sign + fmt(tx.amount) + '</div>' +
        '<button class="tx-edit" onclick="editTx(' + tx.rowIndex + ')">✎</button>' +
        '<button class="tx-del" onclick="deleteTx(' + tx.rowIndex + ')">✕</button>' +
      '</div>';
    }).join('');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function submitTx(){
    const date = document.getElementById('fDate').value;
    const category = document.getElementById('fCategory').value.trim();
    const description = document.getElementById('fDesc').value.trim();
    const amount = document.getElementById('fAmount').value;

    if (!date || !category || !amount || Number(amount) <= 0){
      alert('กรอกวันที่ หมวดหมู่ และจำนวนเงินให้ครบก่อนนะครับ');
      return;
    }

    const data = { date, type: currentType, category, description, amount };
    if (pendingReceipt) data.receipt = pendingReceipt;

    if (editingRowIndex !== null){
      data.existingReceiptUrl = existingReceiptUrl;
      data.removeReceipt = removeReceiptFlag;
      apiPost('updateTransaction', { rowIndex: editingRowIndex, data: data }).then(function(){
        cancelEdit();
        loadData();
      }).catch(onError);
    } else {
      apiPost('addTransaction', { data: data }).then(function(){
        document.getElementById('fCategory').value = '';
        document.getElementById('fDesc').value = '';
        document.getElementById('fAmount').value = '';
        clearPendingReceipt();
        loadData();
      }).catch(onError);
    }
  }

  function onReceiptChosen(){
    const input = document.getElementById('fReceipt');
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024){
      alert('ไฟล์ใหญ่เกินไป กรุณาเลือกไฟล์ไม่เกิน 5MB');
      input.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e){
      const base64 = e.target.result.split(',')[1];
      pendingReceipt = { base64: base64, mimeType: file.type || 'application/octet-stream', filename: file.name };
      removeReceiptFlag = false;
      renderReceiptPreview();
    };
    reader.readAsDataURL(file);
  }

  function renderReceiptPreview(){
    const el = document.getElementById('receiptPreview');
    if (pendingReceipt){
      el.style.display = 'flex';
      el.innerHTML = '<span>📎 ' + escapeHtml(pendingReceipt.filename) + '</span>' +
        '<button type="button" onclick="clearPendingReceipt()">ยกเลิก</button>';
    } else if (existingReceiptUrl){
      el.style.display = 'flex';
      el.innerHTML = '<a href="' + existingReceiptUrl + '" target="_blank">📎 ดูใบเสร็จเดิม</a>' +
        '<button type="button" onclick="removeExistingReceipt()">ลบ</button>';
    } else {
      el.style.display = 'none';
      el.innerHTML = '';
    }
  }

  function clearPendingReceipt(){
    pendingReceipt = null;
    document.getElementById('fReceipt').value = '';
    renderReceiptPreview();
  }

  function removeExistingReceipt(){
    existingReceiptUrl = '';
    removeReceiptFlag = true;
    renderReceiptPreview();
  }

  function editTx(rowIndex){
    if (!cachedData) return;
    const tx = cachedData.transactions.find(function(t){ return t.rowIndex === rowIndex; });
    if (!tx) return;

    editingRowIndex = rowIndex;
    setType(tx.type);
    document.getElementById('fDate').value = tx.date;
    document.getElementById('fCategory').value = tx.category;
    document.getElementById('fDesc').value = tx.description;
    document.getElementById('fAmount').value = tx.amount;

    pendingReceipt = null;
    removeReceiptFlag = false;
    existingReceiptUrl = tx.receiptUrl || '';
    document.getElementById('fReceipt').value = '';
    renderReceiptPreview();

    document.getElementById('formTitle').textContent = 'แก้ไขรายการ';
    document.getElementById('submitBtn').textContent = 'บันทึกการแก้ไข';
    document.getElementById('cancelBtn').style.display = 'block';
    openAccordion('addTxBody');
    document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function cancelEdit(){
    editingRowIndex = null;
    document.getElementById('fCategory').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fAmount').value = '';
    document.getElementById('fDate').value = todayStr();
    document.getElementById('formTitle').textContent = 'เพิ่มรายการ';
    document.getElementById('submitBtn').textContent = 'บันทึกรายการ';
    document.getElementById('cancelBtn').style.display = 'none';

    pendingReceipt = null;
    removeReceiptFlag = false;
    existingReceiptUrl = '';
    document.getElementById('fReceipt').value = '';
    renderReceiptPreview();
  }

  function deleteTx(rowIndex){
    if (!confirm('ลบรายการนี้?')) return;
    apiPost('deleteTransaction', { rowIndex: rowIndex }).then(loadData).catch(onError);
  }

  // ===== Tab switching =====
  function switchTab(tab){
    currentTab = tab;
    document.getElementById('tabFinance').classList.toggle('active', tab === 'finance');
    document.getElementById('tabFinance').classList.toggle('neutral', tab === 'finance');
    document.getElementById('tabDailyLog').classList.toggle('active', tab === 'dailylog');
    document.getElementById('tabDailyLog').classList.toggle('neutral', tab === 'dailylog');
    document.getElementById('financeView').style.display = (tab === 'finance') ? 'block' : 'none';
    document.getElementById('dailyLogView').style.display = (tab === 'dailylog') ? 'block' : 'none';
    if (tab === 'dailylog' && cachedDailyLogs === null) loadDailyLogs();
    try { localStorage.setItem('sanSandwichTab', tab); } catch (e) {}
  }

  // ===== Daily log (บันทึกประจำวัน) =====
  function loadDailyLogs(){
    document.getElementById('dlDate').value = todayStr();
    apiGet('getDailyLogs').then(renderDailyLogs).catch(onDailyLogError);
    loadMenuItems();
  }

  function onDailyLogError(err){
    document.getElementById('dailyLogList').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + err.message + '</div>';
  }

  function renderDailyLogs(logs){
    cachedDailyLogs = logs;
    const el = document.getElementById('dailyLogList');

    const byDate = {};
    logs.forEach(function(log){ byDate[log.date] = log; });

    const dates = getUpcomingAndRecentDates_(7); // tomorrow, then today, then 6 days back
    el.innerHTML = dates.map(function(dateStr){
      const log = byDate[dateStr];
      const isToday = dateStr === todayStr();
      const isTomorrow = dateStr === tomorrowStr();
      const dateLabel = dateStr + (isToday ? ' (วันนี้)' : isTomorrow ? ' (พรุ่งนี้)' : '');

      if (!log){
        return '<div class="dl-item">' +
          '<div class="dl-top">' +
            '<span class="dl-date">' + dateLabel + '</span>' +
            '<div class="dl-actions">' +
              '<button onclick="addDailyLogForDate(\'' + dateStr + '\')">+ เพิ่ม</button>' +
            '</div>' +
          '</div>' +
          '<div class="empty" style="padding:4px 0;">ยังไม่มีบันทึก</div>' +
        '</div>';
      }

      const totalMoney = log.transfer + log.cash;
      const menuTotal_ = function(v){ return (v && typeof v === 'object') ? ((v.normal||0) + (v.mini||0)) : (v || 0); };
      const menuNames = Object.keys(log.menuBreakdown || {})
        .sort(function(a, b){ return menuTotal_(log.menuBreakdown[b]) - menuTotal_(log.menuBreakdown[a]); });
      const menuLine = menuNames.length
        ? '<div class="dl-menu">🍱 ' + menuNames.map(function(n){
            const v = log.menuBreakdown[n];
            if (v && typeof v === 'object'){
              const normal = v.normal || 0;
              const mini = v.mini || 0;
              return escapeHtml(n) + ' ' + normal + (mini ? ' (มินิ ' + mini + ')' : '');
            }
            return escapeHtml(n) + ' ' + v;
          }).join(', ') + '</div>'
        : '';
      return '<div class="dl-item">' +
        '<div class="dl-top">' +
          '<span class="dl-date">' + dateLabel + '</span>' +
          '<div class="dl-actions">' +
            '<button onclick="editDailyLog(' + log.rowIndex + ')">✎</button>' +
            '<button onclick="deleteDailyLogRow(' + log.rowIndex + ')">✕</button>' +
          '</div>' +
        '</div>' +
        menuLine +
        '<div class="dl-grid">' +
          '<span>ทำ <b>' + log.made + '</b> กล่อง</span>' +
          '<span>ขายได้ <b>' + log.sold + '</b> กล่อง</span>' +
          '<span>เหลือ <b>' + log.remaining + '</b> กล่อง</span>' +
          '<span>เอาไป <b>' + log.takenAway + '</b> กล่อง</span>' +
          '<span>โอน <b>' + fmt(log.transfer) + '</b></span>' +
          '<span>สด <b>' + fmt(log.cash) + '</b></span>' +
          '<span>เงินทอน <b>' + fmt(log.basketCash) + '</b></span>' +
          '<span>รวมเงิน <b>' + fmt(totalMoney) + '</b></span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function getLastNDates_(n){
    const dates = [];
    const today = new Date();
    for (let i = 0; i < n; i++){
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      dates.push(localDateStr_(d));
    }
    return dates;
  }

  function tomorrowStr(){
    const d = new Date();
    d.setDate(d.getDate() + 1);
    return localDateStr_(d);
  }

  // tomorrow first (so it's easy to pre-plan the next day), then today, then daysBack days before it
  function getUpcomingAndRecentDates_(daysBack){
    return [tomorrowStr()].concat(getLastNDates_(daysBack));
  }

  function addDailyLogForDate(dateStr){
    cancelDailyLogEdit();
    document.getElementById('dlDate').value = dateStr;
    openAccordion('dlFormBody');
    document.querySelector('#dailyLogView .card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // auto-calc: เหลือ = ทำ - ขายได้ | รวมเงิน = ขายได้ × 25 | เงินสด = รวมเงิน - เงินโอน
  function recalcDailyLog(){
    const made = parseFloat(document.getElementById('dlMade').value) || 0;
    const sold = parseFloat(document.getElementById('dlSold').value) || 0;
    const transfer = parseFloat(document.getElementById('dlTransfer').value) || 0;

    const remaining = made - sold;
    document.getElementById('dlRemaining').value = remaining;

    const totalMoney = sold * 25; // รวมเงิน (ยอดขายที่ควรได้รับทั้งหมด)
    const cash = totalMoney - transfer;
    document.getElementById('dlCash').value = cash;
  }

  // ===== Menu items (เมนูที่จะทำวันนี้) =====
  function loadMenuItems(){
    apiGet('getMenuItems').then(function(items){
      cachedMenuItems = items;
      renderMenuItemList({}); // no saved quantities yet (fresh form / today)
    }).catch(function(err){
      document.getElementById('menuItemList').innerHTML = '<div class="empty">โหลดเมนูไม่สำเร็จ: ' + err.message + '</div>';
    });
  }

  function renderMenuItemList(quantities){
    quantities = quantities || {};
    const el = document.getElementById('menuItemList');
    if (!cachedMenuItems.length){
      el.innerHTML = '<div class="empty">ยังไม่มีเมนู เพิ่มเมนูแรกได้ด้านล่าง</div>';
      updateMenuTotal();
      return;
    }
    el.innerHTML = cachedMenuItems.map(function(name){
      // backward-compatible: older saved entries were a plain number (no size split)
      const raw = quantities[name];
      const normal = (raw && typeof raw === 'object') ? (raw.normal || 0) : (raw || 0);
      const mini = (raw && typeof raw === 'object') ? (raw.mini || 0) : 0;
      const safeName = name.replace(/'/g, "\\'");
      return '<div class="menu-row">' +
        '<div class="menu-row-top">' +
          '<span class="menu-row-name">' + escapeHtml(name) + '</span>' +
          '<button type="button" class="menu-row-del" onclick="removeMenuItemUI(\'' + safeName + '\')">✕</button>' +
        '</div>' +
        '<div class="menu-row-sizes">' +
          menuSizeGroupHtml_(name, safeName, 'normal', 'ปกติ', normal) +
          menuSizeGroupHtml_(name, safeName, 'mini', 'มินิ', mini) +
        '</div>' +
      '</div>';
    }).join('');
    updateMenuTotal();
  }

  function menuSizeGroupHtml_(name, safeName, size, label, qty){
    return '<div class="menu-size-group">' +
      '<span class="menu-size-label">' + label + '</span>' +
      '<div class="menu-stepper">' +
        '<button type="button" class="stepper-btn" onclick="stepMenuQty(\'' + safeName + '\', \'' + size + '\', -1)">−</button>' +
        '<input type="number" min="0" value="' + qty + '" readonly ' +
          'data-menu-name="' + escapeHtml(name) + '" data-menu-size="' + size + '">' +
        '<button type="button" class="stepper-btn" onclick="stepMenuQty(\'' + safeName + '\', \'' + size + '\', 1)">+</button>' +
      '</div>' +
    '</div>';
  }

  function stepMenuQty(name, size, delta){
    const input = document.querySelector(
      '#menuItemList input[data-menu-name="' + cssEscape_(name) + '"][data-menu-size="' + size + '"]'
    );
    if (!input) return;
    const next = Math.max(0, (parseFloat(input.value) || 0) + delta);
    input.value = next;
    sumMenuQuantitiesIntoMade();
  }

  // minimal CSS.escape fallback (data-menu-name values are plain Thai/English text, but this keeps quoting safe)
  function cssEscape_(str){
    return String(str).replace(/["\\]/g, '\\$&');
  }

  function getMenuQuantities(){
    const quantities = {};
    document.querySelectorAll('#menuItemList input[data-menu-name]').forEach(function(input){
      const name = input.getAttribute('data-menu-name');
      const size = input.getAttribute('data-menu-size');
      const qty = parseFloat(input.value) || 0;
      if (!quantities[name]) quantities[name] = { normal: 0, mini: 0 };
      quantities[name][size] = qty;
    });
    // drop items where both sizes are 0
    Object.keys(quantities).forEach(function(name){
      if (!quantities[name].normal && !quantities[name].mini) delete quantities[name];
    });
    return quantities;
  }

  function sumMenuQuantitiesIntoMade(){
    let total = 0;
    document.querySelectorAll('#menuItemList input[data-menu-name]').forEach(function(input){
      total += parseFloat(input.value) || 0;
    });
    document.getElementById('dlMade').value = total;
    updateMenuTotal(total);
    recalcDailyLog();
  }

  function updateMenuTotal(precomputedTotal){
    let total = precomputedTotal;
    if (total === undefined){
      total = 0;
      document.querySelectorAll('#menuItemList input[data-menu-name]').forEach(function(input){
        total += parseFloat(input.value) || 0;
      });
    }
    const value = total * 25;
    const el = document.getElementById('menuTotalDisplay');
    if (el) el.textContent = 'รวมทั้งหมด ' + total + ' ชิ้น (฿' + value.toLocaleString('th-TH') + ')';
  }

  function addMenuItemUI(){
    const input = document.getElementById('menuNewName');
    const name = input.value.trim();
    if (!name) return;
    const quantitiesBefore = getMenuQuantities();
    apiPost('addMenuItem', { name: name }).then(function(){
      return apiGet('getMenuItems');
    }).then(function(items){
      cachedMenuItems = items;
      renderMenuItemList(quantitiesBefore);
      input.value = '';
    }).catch(function(err){ alert('เพิ่มเมนูไม่สำเร็จ: ' + err.message); });
  }

  function removeMenuItemUI(name){
    if (!confirm('ลบเมนู "' + name + '" ออกจากรายการหรือไม่? (จะลบเฉพาะรายชื่อเมนู ไม่กระทบข้อมูลที่บันทึกไว้แล้ว)')) return;
    const quantitiesBefore = getMenuQuantities();
    delete quantitiesBefore[name];
    apiPost('deleteMenuItem', { name: name }).then(function(){
      return apiGet('getMenuItems');
    }).then(function(items){
      cachedMenuItems = items;
      renderMenuItemList(quantitiesBefore);
      sumMenuQuantitiesIntoMade();
    }).catch(function(err){ alert('ลบเมนูไม่สำเร็จ: ' + err.message); });
  }

  function submitDailyLog(){
    const date = document.getElementById('dlDate').value;
    if (!date){ alert('กรุณาเลือกวันที่'); return; }

    const data = {
      date: date,
      made: document.getElementById('dlMade').value || 0,
      sold: document.getElementById('dlSold').value || 0,
      remaining: document.getElementById('dlRemaining').value || 0,
      takenAway: document.getElementById('dlTakenAway').value || 0,
      transfer: document.getElementById('dlTransfer').value || 0,
      cash: document.getElementById('dlCash').value || 0,
      basketCash: document.getElementById('dlBasketCash').value || 0,
      menuBreakdown: getMenuQuantities()
    };

    apiPost('saveDailyLog', { data: data }).then(function(){
      cancelDailyLogEdit();
      loadDailyLogs();
      loadData(); // refresh รายรับ-รายจ่าย too, since this syncs a "ขายได้" transaction
    }).catch(onDailyLogError);
  }

  function editDailyLog(rowIndex){
    if (!cachedDailyLogs) return;
    const log = cachedDailyLogs.find(function(l){ return l.rowIndex === rowIndex; });
    if (!log) return;

    editingDailyLogRowIndex = rowIndex;
    document.getElementById('dlDate').value = log.date;
    document.getElementById('dlMade').value = log.made;
    document.getElementById('dlSold').value = log.sold;
    document.getElementById('dlRemaining').value = log.remaining;
    document.getElementById('dlTakenAway').value = log.takenAway;
    document.getElementById('dlTransfer').value = log.transfer;
    document.getElementById('dlCash').value = log.cash;
    document.getElementById('dlBasketCash').value = log.basketCash;
    renderMenuItemList(log.menuBreakdown || {});

    document.getElementById('dailyLogFormTitle').textContent = 'แก้ไขบันทึกประจำวัน';
    document.getElementById('dlSubmitBtn').textContent = 'บันทึกการแก้ไข';
    document.getElementById('dlCancelBtn').style.display = 'block';
    openAccordion('dlFormBody');
    document.querySelector('#dailyLogView .card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function cancelDailyLogEdit(){
    editingDailyLogRowIndex = null;
    document.getElementById('dlDate').value = todayStr();
    document.getElementById('dlMade').value = '';
    document.getElementById('dlSold').value = '';
    document.getElementById('dlRemaining').value = '';
    document.getElementById('dlTakenAway').value = '';
    document.getElementById('dlTransfer').value = '';
    document.getElementById('dlCash').value = '';
    document.getElementById('dlBasketCash').value = '';
    renderMenuItemList({});
    document.getElementById('dailyLogFormTitle').textContent = 'บันทึกประจำวัน';
    document.getElementById('dlSubmitBtn').textContent = 'บันทึก';
    document.getElementById('dlCancelBtn').style.display = 'none';
  }

  function deleteDailyLogRow(rowIndex){
    if (!confirm('ลบบันทึกนี้?')) return;
    apiPost('deleteDailyLog', { rowIndex: rowIndex }).then(function(){
      loadDailyLogs();
      loadData();
    }).catch(onDailyLogError);
  }

  // ===== Accordion (inline expand/collapse, no popup) =====
  function toggleAccordion(bodyId){
    const body = document.getElementById(bodyId);
    const arrow = document.getElementById(bodyId + 'Arrow');
    const isOpen = body.style.display !== 'none';
    body.style.display = isOpen ? 'none' : 'block';
    if (arrow) arrow.classList.toggle('open', !isOpen);
  }

  function openAccordion(bodyId){
    const body = document.getElementById(bodyId);
    const arrow = document.getElementById(bodyId + 'Arrow');
    body.style.display = 'block';
    if (arrow) arrow.classList.add('open');
  }

  // restore whichever tab was open before the page was refreshed
  try {
    const savedTab = localStorage.getItem('sanSandwichTab');
    if (savedTab === 'dailylog') switchTab('dailylog');
  } catch (e) {}

  loadData();
</script>
</body>
</html>
